services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.slim
    env_file:
      - ./.env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.slim
    command: ["python", "-m", "celery", "-A", "config", "worker", "-l", "info"]
    env_file:
      - ./.env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
    restart: unless-stopped

  # The flood schedule is explicit in development and always enabled by the
  # production override, preserving the current production behavior.
  beat:
    profiles: ["flood"]
    build:
      context: .
      dockerfile: Dockerfile.slim
    command: ["python", "-m", "celery", "-A", "config", "beat", "-l", "info"]
    env_file:
      - ./.env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
    restart: unless-stopped

  demo-stream:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: Dockerfile.slim
      target: demo
    command:
      [
        "python",
        "manage.py",
        "run_demo_stream",
        "--scenario",
        "/demo-assets/scenario.json",
      ]
    env_file:
      - ./.env
    environment:
      DEMO_SCENARIO_PATH: /demo-assets/scenario.json
      DEMO_STREAM_MEDIA_INTERNAL_BASE_URL: http://demo-stream:8088
    ports:
      - "${DEMO_STREAM_PORT:-8088}:8088"
    expose:
      - "8089"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8089/health', timeout=2)",
        ]
      interval: 6h
      start_interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:16-alpine
    env_file:
      - ./.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hackathon}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  media:
