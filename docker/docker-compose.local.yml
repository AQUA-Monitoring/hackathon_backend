name: hackathon_local

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.slim
    command: ["python", "manage.py", "runserver", "0.0.0.0:8090"]
    env_file:
      - ../.env
    ports:
      - "8091:8090"
    volumes:
      - ..:/app
      - media:/app/media:ro
    networks:
      - shared_backend

volumes:
  media:
    external: true
    name: docker_media

networks:
  shared_backend:
    external: true
    name: docker_shared_backend
