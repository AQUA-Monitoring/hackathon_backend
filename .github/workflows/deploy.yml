name: 'deploy'

on:
  # Legacy Dokku deployment kept only for an explicitly approved manual
  # recovery. Docker Compose and Aqua Ops are the canonical release path.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Cloning repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to dokku
        uses: dokku/github-action@master
        with:
          git_remote_url: 'ssh://dokku@app2.fabricadesoftware.ifc.edu.br:1022/aquaapi'
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          branch: main
