services:
  web:
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health/', timeout=2)",
        ]
      interval: 30s
      start_interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    ports:
      - "8000:8090"
    restart: unless-stopped

  worker:
    restart: unless-stopped

  beat:
    restart: unless-stopped

  redis:
    healthcheck:
      interval: 30s
      start_interval: 5s
      start_period: 20s
    restart: unless-stopped

  db:
    healthcheck:
      interval: 30s
      start_interval: 5s
      start_period: 20s
    ports:
      - "5433:5432"
    restart: unless-stopped

volumes:
  pgdata:
    external: true
    name: docker_pgdata
  media:
    external: true
    name: docker_media
